name: build

on:
  push:
    branches-ignore: [ci-out]
  workflow_dispatch:

# The job publishes its results (log tail, test results, unsigned APK) to the
# "ci-out" branch so they can be read with plain git.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release APK
        id: gradle
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Publish results to ci-out
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          set -e
          OUT="$RUNNER_TEMP/ci-out"
          mkdir -p "$OUT/test-results"
          cd "$GITHUB_WORKSPACE"

          {
            echo "source_sha=$GITHUB_SHA"
            echo "outcome=$BUILD_OUTCOME"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            grep -E '^seekertv\.version' gradle.properties || true
          } > "$OUT/report.txt"

          if [ -f build.log ]; then
            tail -n 300 build.log > "$OUT/build-log-tail.txt"
            grep -n -E '^e: |^w: .*deprecated|error:|FAILED|What went wrong|Could not|Unresolved|Exception' build.log | head -n 200 > "$OUT/build-errors.txt" || true
          fi

          find app/build/test-results -name '*.xml' -exec cp {} "$OUT/test-results/" \; 2>/dev/null || true

          APK="$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)"
          if [ -n "$APK" ]; then
            cp "$APK" "$OUT/seekertv-unsigned.apk"
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
            echo "build_tools=$BT" >> "$OUT/report.txt"
            cp "$BT/lib/apksigner.jar" "$OUT/apksigner.jar"
            if "$BT/zipalign" -c -P 16 -v 4 "$APK" > "$OUT/zipalign-check.txt" 2>&1; then
              echo "zipalign=ok" >> "$OUT/report.txt"
            else
              echo "zipalign=FAILED" >> "$OUT/report.txt"
            fi
            "$BT/aapt2" dump badging "$APK" 2>/dev/null | head -n 4 >> "$OUT/report.txt" || true
            echo "unsigned_sha256=$(sha256sum "$OUT/seekertv-unsigned.apk" | cut -d' ' -f1)" >> "$OUT/report.txt"
            echo "unsigned_bytes=$(stat -c %s "$OUT/seekertv-unsigned.apk")" >> "$OUT/report.txt"
          else
            echo "apk=none" >> "$OUT/report.txt"
          fi

          cd "$OUT"
          git init -q -b ci-out
          git config user.name "seekertv-ci"
          git config user.email "seekertv-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "ci-out for $GITHUB_SHA ($BUILD_OUTCOME) run $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-out
